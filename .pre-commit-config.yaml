# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # Run the linter and auto-fix if possible
      - id: ruff
        args: [ --fix ]
      # Run the formatter
      - id: ruff-format
