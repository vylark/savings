[tool.ruff]
# Target python version
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), isort (I), bugbear (B),
# pyupgrade (UP), and type annotation (ANN) rules
select = ["F", "E", "W", "I", "B", "UP", "ANN"]
ignore = [
    "E501",   # Defer line length checks to the formatter
    "ANN204", # Missing return type annotation for special method (__init__)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicitly set default loop scope for pytest-asyncio 0.24+ to silence deprecation warnings
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --cov=src --cov-report=term-missing"
filterwarnings = ["ignore:deprecated:DeprecationWarning:zxcvbn"]
